name: Publish packages

# Manual only: the crate names on crates.io belong to the archived upstream,
# so a release tag must not try to publish.
on:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  crates:
    name: Publish Rust Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Publish to crates
        env:
          CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
        run: |
          bash -c 'cd tree-sitter-asciidoc && cargo publish'
          bash -c 'cd tree-sitter-asciidoc_inline && cargo publish'
